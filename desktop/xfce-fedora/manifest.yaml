name: fedora-desktop
layer: desktop
os: fedora-43
description: >
  XFCE desktop on Fedora over VNC, derived from core-fedora-43. Ships a
  usable baseline: Firefox, git, openssh-clients, curl, vim, less, plus
  mise — which installs toolchains into ~/.local/share/mise on the home
  volume, so they survive pod restarts.
version: "3.0.0"
from: core-fedora-43
icon: fedora

variants:
  - name: fedora-desktop-43
    smoke:
      vnc: true
      audio: true
