name: ubuntu-desktop
layer: desktop
description: >
  XFCE desktop over VNC, derived from the apt core image. Ships a usable
  baseline: Firefox, git, openssh-client, curl, vim, less, plus mise —
  which installs toolchains into ~/.local/share/mise on the home volume,
  so they survive pod restarts.
version: "3.0.0"
from: core-ubuntu-noble
# No "xfce" slug in dashboard-icons — the OS icon is the best fit.
icon: ubuntu-linux

variants:
  # Also the parent of apps/devtools (the one apps/* image that is a
  # full desktop rather than a kiosk on the bare core).
  - name: ubuntu-desktop-noble
    smoke:
      vnc: true
      audio: true

  # Debian 13 leg: same Dockerfile, parent switched to the debian core.
  - name: debian-desktop-13
    os: debian-13
    from: core-debian-13
    icon: debian-linux
    smoke:
      vnc: true
      audio: true
